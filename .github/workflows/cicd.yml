name: CI/CD for Dockerized fastapi app

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build-and-test:   ## name of the job
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: set up python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.10"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest
  
  build-and-publish:
    needs: build-and-test  #this tells after completing build and test only you do this task otherwise it will do it parallaly 
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to docker
        uses: docker/login-action@v2
        with: 
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/fastapi-app:latest
          
      - name: Image digest
        run: echo ${{steps.docker_build.outputs.digest}}
          

      
    



